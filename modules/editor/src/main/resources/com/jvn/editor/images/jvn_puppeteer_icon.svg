<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">JVN Puppeteer icon</title>
  <desc id="desc">The metallic JVN wordmark with overlapping comedy and tragedy theater masks.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b5660"/>
      <stop offset="0.25" stop-color="#f9fbfc"/>
      <stop offset="0.48" stop-color="#83909b"/>
      <stop offset="0.68" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#4b5660"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.14" stop-color="#cfd8df"/>
      <stop offset="0.27" stop-color="#7c8791"/>
      <stop offset="0.42" stop-color="#f9fbfc"/>
      <stop offset="0.58" stop-color="#9da8b2"/>
      <stop offset="0.76" stop-color="#eef3f7"/>
      <stop offset="1" stop-color="#59636d"/>
    </linearGradient>
    <linearGradient id="brushOrange" x1="58" y1="368" x2="442" y2="286" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.08"/>
      <stop offset="0.18" stop-color="#ff8f24" stop-opacity="0.52"/>
      <stop offset="0.58" stop-color="#f26a21" stop-opacity="0.82"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="160%" height="170%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <g id="theater-badge" transform="translate(272 39) rotate(-4 104 78)" filter="url(#shadow)">
    <path d="M50 18 C78 -2 118 2 142 22" fill="none" stroke="#f27825" stroke-width="8" stroke-linecap="round" opacity="0.74"/>
    <path d="M125 21 C154 3 184 8 203 31" fill="none" stroke="#ffad45" stroke-width="7" stroke-linecap="round" opacity="0.62"/>

    <g id="tragedy-mask" transform="rotate(-11 57 70)">
      <path d="M12 15 C34 2 77 1 101 17 L97 76 C94 105 72 125 53 128 C32 125 12 106 8 76 Z"
            fill="#20272d" stroke="#20272d" stroke-width="12" stroke-linejoin="round"/>
      <path d="M14 16 C36 6 75 5 95 20 L91 74 C88 99 70 117 53 120 C35 117 18 100 14 74 Z"
            fill="url(#steel)" stroke="#e1e7eb" stroke-width="3" stroke-linejoin="round"/>
      <path d="M25 45 Q35 34 47 43 Q37 54 25 45 Z M61 43 Q73 34 84 45 Q72 54 61 43 Z" fill="#263038"/>
      <path d="M25 35 Q35 28 47 34 M62 34 Q74 27 84 36" fill="none" stroke="#56616a" stroke-width="4" stroke-linecap="round"/>
      <path d="M52 48 L47 70 L57 72" fill="none" stroke="#737f89" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M29 98 Q52 76 78 98" fill="none" stroke="#263038" stroke-width="8" stroke-linecap="round"/>
      <path d="M24 23 Q51 12 84 22" fill="none" stroke="#fff" stroke-opacity="0.44" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g id="comedy-mask" transform="translate(78 22) rotate(10 57 70)">
      <path d="M12 15 C34 2 77 1 101 17 L97 76 C94 105 72 125 53 128 C32 125 12 106 8 76 Z"
            fill="#20272d" stroke="#20272d" stroke-width="12" stroke-linejoin="round"/>
      <path d="M14 16 C36 6 75 5 95 20 L91 74 C88 99 70 117 53 120 C35 117 18 100 14 74 Z"
            fill="url(#metal)" stroke="#f3f6f8" stroke-width="3" stroke-linejoin="round"/>
      <path d="M24 46 Q35 55 47 44 Q36 36 24 46 Z M61 44 Q73 55 85 44 Q73 35 61 44 Z" fill="#263038"/>
      <path d="M26 36 Q36 43 46 35 M63 35 Q74 43 84 34" fill="none" stroke="#69757f" stroke-width="4" stroke-linecap="round"/>
      <path d="M53 48 L48 69 L58 71" fill="none" stroke="#7b8791" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M27 82 Q52 109 81 81" fill="#263038" stroke="#263038" stroke-width="4" stroke-linejoin="round"/>
      <path d="M34 88 Q53 101 73 87" fill="none" stroke="#eef3f7" stroke-width="4" stroke-linecap="round"/>
      <path d="M24 23 Q51 12 84 22" fill="none" stroke="#fff" stroke-opacity="0.62" stroke-width="4" stroke-linecap="round"/>
    </g>
  </g>

  <path d="M58 368 C157 333 287 346 442 286" fill="none" stroke="url(#brushOrange)" stroke-width="31" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <text x="54" y="365" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
          font-size="174" font-weight="900" letter-spacing="5" fill="url(#metal)">JVN</text>
  </g>
</svg>
