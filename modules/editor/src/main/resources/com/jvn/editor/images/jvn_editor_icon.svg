<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">JVN Editor icon</title>
  <desc id="desc">The metallic JVN mark in front of a larger polished Allen wrench.</desc>
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b555f"/>
      <stop offset="0.22" stop-color="#f8fbfd"/>
      <stop offset="0.42" stop-color="#84919c"/>
      <stop offset="0.63" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#46515b"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.14" stop-color="#cfd8df"/>
      <stop offset="0.27" stop-color="#7c8791"/>
      <stop offset="0.42" stop-color="#f9fbfc"/>
      <stop offset="0.58" stop-color="#9da8b2"/>
      <stop offset="0.76" stop-color="#eef3f7"/>
      <stop offset="1" stop-color="#59636d"/>
    </linearGradient>
    <linearGradient id="brushOrange" x1="92" y1="374" x2="432" y2="292" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.10"/>
      <stop offset="0.18" stop-color="#ff8f24" stop-opacity="0.58"/>
      <stop offset="0.58" stop-color="#f26a21" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="160%">
