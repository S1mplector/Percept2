    <path d="M104 426 V142 Q104 82 164 82 H430"
          fill="none" stroke="url(#steel)" stroke-width="60" stroke-linecap="butt" stroke-linejoin="round"/>
    <path d="M91 406 V146 Q91 98 158 98 H414"
