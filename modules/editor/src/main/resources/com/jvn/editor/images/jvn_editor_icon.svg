    <path d="M74 426 L89 400 H119 L134 426 L119 452 H89 Z" fill="#263038" stroke="#dce5eb" stroke-width="5"/>
    <path d="M430 52 L456 67 V97 L430 112 L404 97 V67 Z" fill="#263038" stroke="#dce5eb" stroke-width="5"/>
  </g>

  <path d="M82 378 C174 340 288 354 444 294" fill="none" stroke="url(#brushOrange)" stroke-width="34" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <text x="72" y="376" font-family="Inter, ui-sans-serif, system-ui, sans-serif"
          font-size="166" font-weight="900" letter-spacing="4" fill="url(#metal)">JVN</text>
