<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JVN Web Runtime</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      background: #090b11;
      color: #d9deea;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(73, 165, 255, 0.12), transparent 38rem),
        #090b11;
    }

    main {
      width: min(92vw, 1280px);
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto !important;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    #jvn-status {
      margin: 0.75rem 0 0;
      color: #8f99aa;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>
  <main>
    <canvas id="jvn-canvas" width="1280" height="720" aria-label="JVN game canvas"></canvas>
    <p id="jvn-status" role="status">Starting JVN web runtime…</p>
  </main>

  <script id="jvn-config" type="application/json">
    {
      "title": "JVN Web Runtime",
      "width": 1280,
      "height": 720,
      "fixedUpdateMs": 16,
      "fixedUpdateMaxSteps": 5,
      "timeScale": 1.0
    }
  </script>
  <script src="js/jvn-web.js"></script>
  <script>main();</script>
</body>
</html>
