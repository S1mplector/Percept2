# JVN High-Contrast Accessibility Theme
# Overrides VnUiStyleSpec colour defaults for maximum legibility.
# Background: black. Foreground: white. Accent: bright yellow.

# Dialogue text
dialogue.text.color=#FFFFFF
dialogue.textbox.color=#000000
dialogue.textbox.opacity=1.0
dialogue.text.font.weight=Bold

# Name box
name.box.color=#000000
name.box.opacity=1.0
name.text.color=#FFFF00
name.text.font.weight=Bold

# Choice buttons
choice.background.color=#000000
choice.text.color=#FFFFFF
choice.hover.color=#333300
choice.hover.text.color=#FFFF00
choice.selected.color=#000033
choice.selected.text.color=#FFFFFF
choice.border.color=#FFFFFF
choice.hover.border.color=#FFFF00
choice.selected.border.color=#FFFFFF
choice.border.width=2.0
choice.corner.radius=4.0

# NVL panel
nvl.panel.color=#000000
nvl.panel.opacity=1.0
nvl.text.color=#FFFFFF
nvl.speaker.text.color=#FFFF00

# Bubble
bubble.color=#000000
bubble.opacity=1.0
bubble.text.color=#FFFFFF
bubble.speaker.text.color=#FFFF00
bubble.border.color=#FFFFFF
bubble.border.width=2.0
