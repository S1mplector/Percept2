# JVN OpenDyslexic Accessibility Theme
# Overrides font families to use OpenDyslexic (SIL OFL 1.1 licensed).
# Colors are softened to reduce visual stress (cream/off-white on dark navy).
#
# OpenDyslexic font is bundled at:
#   com/jvn/core/fonts/OpenDyslexic-Regular.otf
#   com/jvn/core/fonts/OpenDyslexic-Bold.otf
# License: SIL Open Font License 1.1 — see com/jvn/core/fonts/LICENSE-OFL.txt

# Font overrides
dialogue.text.font.family=OpenDyslexic
dialogue.text.font.weight=Regular
name.text.font.family=OpenDyslexic
name.text.font.weight=Bold
choice.font.family=OpenDyslexic
choice.font.weight=Regular

# Softened palette — off-white on dark navy reduces contrast glare
dialogue.text.color=#F5F0E8
dialogue.textbox.color=#1A1A2E
dialogue.textbox.opacity=0.97

name.box.color=#1A1A2E
name.box.opacity=0.97
name.text.color=#FFD580

choice.background.color=#1A1A2E
choice.text.color=#F5F0E8
choice.hover.color=#2A2A4E
choice.hover.text.color=#FFD580
choice.selected.color=#2A2A4E
choice.selected.text.color=#F5F0E8
choice.border.color=#4A4A7E
choice.hover.border.color=#FFD580
choice.selected.border.color=#FFD580
choice.border.width=1.5
choice.corner.radius=6.0

nvl.panel.color=#1A1A2E
nvl.panel.opacity=0.97
nvl.text.color=#F5F0E8
nvl.speaker.text.color=#FFD580

bubble.color=#1A1A2E
bubble.opacity=0.97
bubble.text.color=#F5F0E8
bubble.speaker.text.color=#FFD580
bubble.border.color=#4A4A7E
bubble.border.width=1.5
