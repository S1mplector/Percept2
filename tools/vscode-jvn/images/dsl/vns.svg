<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">VNS DSL icon</title>
  <desc id="desc">A metallic VNS wordmark over an orange brush swipe with a dialogue bubble symbol.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="18" x2="0" y2="84" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.18" stop-color="#cfd8df"/>
      <stop offset="0.34" stop-color="#7c8791"/>
      <stop offset="0.52" stop-color="#f9fbfc"/>
      <stop offset="0.72" stop-color="#9da8b2"/>
      <stop offset="1" stop-color="#59636d"/>
    </linearGradient>
    <linearGradient id="brush" x1="18" y1="108" x2="174" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff7a1a" stop-opacity="0.16"/>
      <stop offset="0.2" stop-color="#ff9a2e" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#f26a21" stop-opacity="0.9"/>
      <stop offset="0.82" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7a1a" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#ffffff" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect x="12" y="12" width="168" height="168" rx="28" fill="#111315" stroke="#34383d"/>
  <path d="M 24 111 C 63 92, 101 101, 168 79" fill="none" stroke="url(#brush)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 43 126 C 77 116, 119 111, 156 101" fill="none" stroke="#ffcf75" stroke-opacity="0.34" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#soft)">
    <text x="22" y="76" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="48" font-weight="900" letter-spacing="2" fill="url(#metal)">VNS</text>
  </g>
  <path d="M 48 105 H 144 Q 153 105 153 114 V 139 Q 153 148 144 148 H 83 L 63 163 V 148 H 48 Q 39 148 39 139 V 114 Q 39 105 48 105 Z" fill="#f6e497" stroke="#0b0c0d" stroke-width="5"/>
  <path d="M 61 122 H 131 M 61 136 H 111" stroke="#111315" stroke-width="6" stroke-linecap="round"/>
