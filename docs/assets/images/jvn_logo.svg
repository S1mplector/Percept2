<svg xmlns="http://www.w3.org/2000/svg" width="520" height="190" viewBox="0 0 520 190" role="img" aria-labelledby="title desc">
  <title id="title">JVN logo</title>
  <desc id="desc">A background-free metallic JVN wordmark with the v0.1.2 version label to the right.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.14" stop-color="#cfd8df"/>
      <stop offset="0.27" stop-color="#7c8791"/>
      <stop offset="0.42" stop-color="#f9fbfc"/>
      <stop offset="0.58" stop-color="#9da8b2"/>
      <stop offset="0.76" stop-color="#eef3f7"/>
      <stop offset="1" stop-color="#59636d"/>
    </linearGradient>
    <filter id="wordmarkShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.34"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#ffffff" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#wordmarkShadow)">
    <text x="8" y="136"
          font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="154"
          font-weight="900"
          letter-spacing="6"
          fill="url(#metal)">JVN</text>
  </g>

  <g transform="translate(368 102)">
    <text x="0" y="0"
          font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18"
          font-weight="800"
          fill="#121821">v0.1.2</text>
  </g>
</svg>
