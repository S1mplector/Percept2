<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Java Vector Nexus logo</title>
  <desc id="desc">A metallic gradient JVN wordmark with the v0.1 Alpha version badge.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d11"/>
      <stop offset="0.48" stop-color="#151922"/>
      <stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <radialGradient id="halo" cx="42%" cy="22%" r="82%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="0.42" stop-color="#a6b8ca" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.14" stop-color="#cfd8df"/>
      <stop offset="0.27" stop-color="#7c8791"/>
      <stop offset="0.42" stop-color="#f9fbfc"/>
      <stop offset="0.58" stop-color="#9da8b2"/>
      <stop offset="0.76" stop-color="#eef3f7"/>
      <stop offset="1" stop-color="#59636d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#7d8792" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#15191f" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9d45"/>
      <stop offset="0.5" stop-color="#ffd39c"/>
      <stop offset="1" stop-color="#78c7ff"/>
    </linearGradient>
    <filter id="wordmarkShadow" x="-10%" y="-16%" width="120%" height="140%">
      <feDropShadow dx="0" dy="13" stdDeviation="12" flood-color="#000000" flood-opacity="0.52"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#ffffff" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="960" height="300" rx="28" fill="url(#background)"/>
  <rect width="960" height="300" rx="28" fill="url(#halo)"/>
  <path d="M48 236 C214 187 337 220 478 176 C628 129 755 119 912 72" fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.45"/>
  <path d="M72 248 C241 207 356 237 501 191 C658 142 765 139 888 99" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.12"/>

  <g filter="url(#wordmarkShadow)">
    <text x="76" y="190"
          font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="154"
          font-weight="900"
          letter-spacing="6"
          fill="url(#metal)"
          stroke="url(#edge)"
          stroke-width="2.2"
          paint-order="stroke fill">JVN</text>
  </g>

  <g transform="translate(702 196)">
    <rect x="0" y="0" width="184" height="44" rx="22" fill="#0f141b" stroke="url(#accent)" stroke-width="1.4"/>
    <text x="92" y="29"
          text-anchor="middle"
          font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
          font-size="18"
          font-weight="800"
          fill="#f1f5f8">v0.1 Alpha</text>
  </g>
</svg>
