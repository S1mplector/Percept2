name: Game Portable Builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Create smoke-test game project
        run: |
          mkdir -p "$RUNNER_TEMP/jvn-smoke-game/scripts/story" "$RUNNER_TEMP/jvn-smoke-game/assets" "$RUNNER_TEMP/jvn-smoke-game/config"
          printf '%s\n' \
            'name=JVN Smoke Game' \
            'type=vn' \
            'entryVns=scripts/story/prologue.vns' \
            'width=960' \
            'height=540' \
            'runtime.ui=fx' \
            'runtime.audio=auto' \
            'runtime.locale=en' \
            > "$RUNNER_TEMP/jvn-smoke-game/jvn.project"
          printf '%s\n' \
            '@scenario smoke' \
            '@character narrator "Narrator"' \
            '' \
            'Narrator: Smoke packaged game.' \
            '' \
            '[end]' \
            > "$RUNNER_TEMP/jvn-smoke-game/scripts/story/prologue.vns"
      - name: Build portable game archives
        run: ./gradlew assembleJvnGamePortable -PjvnGameProject="$RUNNER_TEMP/jvn-smoke-game" -PjvnGameVersion=0.1.0 --no-daemon
      - name: Upload portable game archives
        uses: actions/upload-artifact@v4
        with:
          name: jvn-game-portable-archives
          path: build/distributions/games/*.zip
