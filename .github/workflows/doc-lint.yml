name: Documentation contract

on:
  workflow_dispatch:
  pull_request:
    branches: [stable, main]
    paths:
      - 'docs/**'
      - 'modules/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'scripts/doc-lint.mjs'
      - '.github/workflows/doc-lint.yml'
  push:
    branches: [stable, main]
    paths:
      - 'docs/**'
      - 'modules/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'scripts/doc-lint.mjs'

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: Links, anchors, assets, and symbols
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run strict documentation lint
        run: node scripts/doc-lint.mjs --strict
      - name: Publish contributor guidance
        if: failure()
        run: |
          {
            echo '## Documentation validation failed'
            echo 'Run `node scripts/doc-lint.mjs --strict` locally.'
            echo 'See `docs/MAINTENANCE.md` for link, symbol, image, and index requirements.'
          } >> "$GITHUB_STEP_SUMMARY"
