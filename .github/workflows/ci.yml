name: Contributor CI

on:
  workflow_dispatch:
  pull_request:
    branches: [stable]
  push:
    branches: [stable]

concurrency:
  group: contributor-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Full verification (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare repository scripts
        run: chmod +x gradlew jvnw scripts/*.sh
      - name: Run contributor verification
        run: ./scripts/verify-contribution.sh
      - name: Upload test and problem reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports-linux
          path: |
            **/build/reports/tests/
            **/build/test-results/
            build/reports/problems/
          if-no-files-found: ignore
          retention-days: 14

  platform-smoke:
    name: Native package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify wrapper bootstrap
        shell: bash
        run: ./scripts/test-jvnw-bootstrap.sh
      - name: Verify Apple system Bash compatibility
        if: runner.os == 'macOS'
        run: /bin/bash ./scripts/test-jvnw-bootstrap.sh
      - name: Compile every module
        run: ./gradlew compileAll
      - name: Build and inspect unsigned native installer
        shell: bash
        run: |
          set -eu
          package_type=dmg
          if [ "$RUNNER_OS" = "Windows" ]; then
            package_type=msi
          fi
          args=(
            -PjvnGameProject="$GITHUB_WORKSPACE/.github/fixtures/native-smoke-game"
            -PjvnGameName="JVN Native Smoke"
            -PjvnGameVersion=1.0.0
            -PjvnPackageMode=native
            -PjvnNativePackageType="$package_type"
            -PjvnReleaseProfile=default
            --no-daemon
          )
          ./gradlew packageJvnGameNativeCurrent "${args[@]}"
          ./gradlew smokeTestJvnGameRelease "${args[@]}"
      - name: Upload native smoke reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-smoke-${{ runner.os }}
          path: |
            build/distributions/games/
            build/reports/problems/
          if-no-files-found: ignore
          retention-days: 14

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
