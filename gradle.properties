org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
jvnVersion=0.4.3.1
# Optional: set jvnBuildDir in this file or pass -PjvnBuildDir=<dir> to relocate workspace build outputs.
# Default Java version used by toolchains (can be overridden per module)
javaVersion=21
# Shared JavaFX version for runtime, editor, audio, and packaging builds.
jvnJavaFxVersion=23.0.1
org.gradle.java.installations.auto-download=true
org.gradle.java.installations.auto-detect=true
# Avoid Gradle VFS watcher lock issues on some Linux setups.
org.gradle.vfs.watch=false
